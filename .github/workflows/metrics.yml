# Metrics card (lowlighter/metrics) — self-hosted SVG committed into this repo.
#
# Generates assets/github-metrics.svg with a dark palette matching the profile
# (bg #0b0d12, text #c9d1d9, accents cyan #22d3ee / violet #a78bfa / emerald #34d399)
# and commits it to main, so the README references it from this repo (self-hosted).
#
# TOKEN — graceful degradation:
#   * If repo secret METRICS_TOKEN exists, it is used (richer plugins work).
#   * Otherwise it falls back to the built-in GITHUB_TOKEN: base + repositories still
#     render, but org-wide / contribution-calendar / in-depth language plugins are
#     limited or skipped (GITHUB_TOKEN cannot read other repos' metadata or private
#     contributions).
#
#   To unlock the full card, V adds a repo secret METRICS_TOKEN = a classic PAT with
#   scopes `repo` + `read:org` (gh: `gh secret set METRICS_TOKEN -R vzero911/vzero911`).
#
# Runs every 12h + on demand + on push to main (workflow changes only).
name: metrics

on:
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate metrics card (dark, self-hosted)
        uses: lowlighter/metrics@v3.34
        with:
          # METRICS_TOKEN if present (full), else built-in GITHUB_TOKEN (base only).
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: VZero911
          filename: assets/github-metrics.svg

          # Commit the SVG straight into main (API commit; [skip ci] avoids re-trigger).
          output_action: commit
          committer_branch: main
          committer_message: "profile: refresh metrics card [skip ci]"

          # Dark palette matching the profile art direction via injected CSS.
          template: classic
          config_timezone: Europe/Paris
          extras_css: |
            :root { --color-text: #c9d1d9; }
            body { background: #0b0d12; }
            svg { background: #0b0d12 !important; }
            .background, rect.background, foreignObject .background { fill: #0b0d12 !important; }
            h2, .title, .field .key { color: #a78bfa !important; fill: #a78bfa !important; }
            text, tspan, .field, .value, .text, td, th, p, span { fill: #c9d1d9 !important; color: #c9d1d9 !important; }
            a { color: #22d3ee !important; fill: #22d3ee !important; }

          # Base plugin fields (works with any token).
          base: header, activity, community, repositories, metadata

          # Languages — most-used + in-depth (in-depth works best with METRICS_TOKEN).
          plugin_languages: yes
          plugin_languages_ignored: html, css, makefile
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github

          # Contribution calendar (isometric) — richer with METRICS_TOKEN.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Activity habits / coding patterns.
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
