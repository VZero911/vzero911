# Contribution snake — self-hosted SVG, no secret required.
#
# Generates a dark snake animation of V0's contribution graph and publishes it to a
# dedicated `output` branch of THIS repo, so the README can reference it from
# raw.githubusercontent.com (self-hosted) instead of a third-party render service.
#
# README reference:
#   https://raw.githubusercontent.com/vzero911/vzero911/output/github-snake-dark.svg
#
# Runs every 12h + on demand + on push to main (workflow changes only). Uses the
# built-in GITHUB_TOKEN — no PAT needed.
name: snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVG (dark palette)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dark background #0b0d12, dots ramping emerald -> cyan, snake emerald.
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2334d399&color_dots=%230b0d12,%23164e45,%231f8a70,%2322d3ee,%235eead4

      - name: Publish to the output branch (self-hosted)
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
