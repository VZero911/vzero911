<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07060f}
canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let s=11;const r=()=>((s=(s*16807)%2147483647)/2147483647);
// night sky
let g=x.createRadialGradient(560,330,40,560,330,1100);g.addColorStop(0,'#2a1f63');g.addColorStop(.45,'#120d2c');g.addColorStop(1,'#07060f');x.fillStyle=g;x.fillRect(0,0,1920,1080);
let h=x.createRadialGradient(1500,880,20,1500,880,700);h.addColorStop(0,'rgba(120,20,50,.45)');h.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=h;x.fillRect(0,0,1920,1080);
// stars
for(let i=0;i<520;i++){const a=r()*.9+.1;x.fillStyle=`rgba(${230+r()*25|0},${220+r()*35|0},255,${a*.8})`;const z=r()<.04?2.2:r()*1.3+.3;x.beginPath();x.arc(r()*1920,r()*1080,z,0,7);x.fill();}
// chain of blocks (perspective line)
const pts=[];for(let i=0;i<26;i++){const t=i/25;pts.push([180+t*1560,760-Math.sin(t*3.1)*120-t*60,18+t*26]);}
x.strokeStyle='rgba(143,108,240,.35)';x.lineWidth=2;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
pts.forEach((p,i)=>{const w=p[2];x.save();x.translate(p[0],p[1]);x.rotate(.12);let gg=x.createLinearGradient(-w,-w,w,w);gg.addColorStop(0,'#5a3fd0');gg.addColorStop(1,'#221d44');x.fillStyle=gg;x.shadowColor=i==25?'#f2c14e':'#8f6cf0';x.shadowBlur=i==25?60:18;x.fillRect(-w/2,-w/2,w,w);x.restore();
 // shards
 const n=(r()*3)|0;for(let k=0;k<n;k++){const cols=['#ff6b3d','#3fa9ff','#5fe0a8','#f2d24e','#a15cff','#f2c14e'];x.fillStyle=cols[(r()*cols.length)|0];x.shadowColor=x.fillStyle;x.shadowBlur=14;const yy=p[1]-w-14-k*18,sz=6+w*.15;x.beginPath();x.moveTo(p[0],yy-sz);x.lineTo(p[0]+sz*.7,yy);x.lineTo(p[0],yy+sz);x.lineTo(p[0]-sz*.7,yy);x.closePath();x.fill();}
});
x.shadowBlur=0;
// golden seed glow (right)
let sg=x.createRadialGradient(1560,330,0,1560,330,260);sg.addColorStop(0,'rgba(255,224,138,.95)');sg.addColorStop(.12,'rgba(242,193,78,.55)');sg.addColorStop(.4,'rgba(242,193,78,.08)');sg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sg;x.fillRect(1200,0,720,700);
x.save();x.translate(1560,330);x.rotate(-.5);x.fillStyle='#ffe08a';x.shadowColor='#f2c14e';x.shadowBlur=50;x.beginPath();x.ellipse(0,0,26,44,0,0,7);x.fill();x.fillStyle='#5fe0a8';x.shadowColor='#5fe0a8';x.shadowBlur=25;x.beginPath();x.ellipse(-10,-52,9,22,-.6,0,7);x.fill();x.restore();
// vignette
let v=x.createRadialGradient(960,540,500,960,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=v;x.fillRect(0,0,1920,1080);
</script></body></html>
