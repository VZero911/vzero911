# Auto-refresh the profile card: regenerate assets/counters.svg + milestones.svg from live GitHub
# numbers, bump the ?v= cache-buster in README.md (so the update actually shows), and commit.
# Runs on GitHub-hosted runners — free and unlimited on this public repo. Every 6h + on demand.
#
# For the FULL card (private repos, contributions, streak) add a repo secret STATS_TOKEN: a PAT with
# `repo` (read) + `read:user`. Without it the job still refreshes public stats and the cache-buster,
# and keeps the rest at their last values (the generator is fail-soft).
#
# The auto-commit carries [skip ci] so it never re-triggers this workflow. The push is sync-and-retry
# so concurrent runs (schedule racing a manual push) can't fail on a non-fast-forward.
name: profile

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/profile-stats.mjs', '.github/workflows/profile.yml']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh and push (sync + retry, deterministic regen on conflict)
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: VZero911
        run: |
          git config user.name "A.L.I.C.E"
          git config user.email "noreply@anthropic.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset --hard -q origin/main
            node tools/profile-stats.mjs
            git add assets/counters.svg assets/milestones.svg assets/stats.json README.md
            if git diff --cached --quiet; then
              echo "profile card unchanged"; exit 0
            fi
            git commit -q -m "profile: auto-refresh the stats card [skip ci]

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
            if git push origin HEAD:main; then echo "pushed (attempt $attempt)"; exit 0; fi
            echo "push rejected, retrying ($attempt)"; sleep 3
          done
          echo "could not push after 3 attempts"; exit 1
